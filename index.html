<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#111126">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Deb: Level 27</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <main id="app" aria-live="polite">
    <header class="hud">
      <button id="homeBtn" class="icon-btn" aria-label="Menu">◆</button>
      <div class="progress-wrap">
        <div class="level-label"><span id="levelText">LEVEL 1 / 27</span><span id="lives">READY</span></div>
        <div class="progress"><i id="progressBar"></i></div>
      </div>
      <button id="restartBtn" class="icon-btn" aria-label="Ricomincia livello">↻</button>
    </header>
    <section id="screen" class="screen"></section>
  </main>

  <template id="menuTemplate">
    <div class="menu-card">
      <div class="pixel-crown">✦</div>
      <p class="eyebrow">A BIRTHDAY ARCADE</p>
      <h1>DEB:<br><em>LEVEL 27</em></h1>
      <p class="intro">Una vita. Ventisette livelli.<br>Zero verdure consentite.</p>
      <button class="primary" data-action="start">PRESS START</button>
      <button class="text-btn" data-action="reset">AZZERA PROGRESSI</button>
      <p class="save-note">I progressi restano su questo dispositivo.</p>
    </div>
  </template>
  <script src="game.js?v=7"></script>
</body>
</html>
